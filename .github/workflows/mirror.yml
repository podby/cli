name: Repo sync (GitHub -> Codeberg)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  schedule:
    - cron: '5 2 * * *'

jobs:
  sync-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Sync repo
        uses: spyoungtech/mirror-action@662fce0eced8996f64d7fa264d76cddd84827f33
        with:
          REMOTE: git@codeberg.org:podby/cli.git
          GIT_SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          GIT_SSH_NO_VERIFY_HOST: 'true'
